[project]
name = "perimeter"
version = "0.1.0"
description = "Python integration perimeter: outbox-dispatcher, receipt-adapter, inbox-reconciler"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
]

[project.scripts]
outbox-dispatcher = "perimeter.dispatcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perimeter"]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
