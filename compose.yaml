x-course-db-env: &course-db-env
  COURSE_DB_HOST: postgres
  COURSE_DB_PORT: "5432"
  COURSE_DB_NAME: course
  COURSE_MIGRATOR_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-migrator}
  COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-publisher}
  WORKFLOW_WORKER_PASSWORD: ${WORKFLOW_WORKER_PASSWORD:-worker}
  # payment:internal included by default (ticket 13 fix): both payment maps'
  # every automatic step pins required_policy: [payment:internal]
  # (Workflow.Core.Security.WorkflowWorkerPrincipal), so without it here
  # bootstrap's own flow-activation step (ticket 13) fails
  # flow.policy_insufficient on a clean `docker compose up -d --build` and
  # the circuit is not ready without a manual override -- exactly the manual
  # step ticket 13 exists to remove.
  WORKFLOW_WORKER_SCOPES: ${WORKFLOW_WORKER_SCOPES:-workflow:execute workflow:read payment:internal}
  # Production default (unset -> long lease, slow poll). The checker's own
  # override always pins this to "1" for api/cli/worker-a/worker-b regardless
  # of what is set here (autocheck/public_check.py `_environment`).
  COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-}

services:
  postgres:
    build: {context: ./db}
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      COURSE_MIGRATOR_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-migrator}
      COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-publisher}
      COURSE_RUNTIME_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-runtime}
      WORKFLOW_WORKER_PASSWORD: ${WORKFLOW_WORKER_PASSWORD:-worker}
      COURSE_OUTBOX_PASSWORD: ${COURSE_OUTBOX_PASSWORD:-outbox}
      COURSE_INBOX_PASSWORD: ${COURSE_INBOX_PASSWORD:-inbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces the TCP check dependents actually need. Without it
      # pg_isready uses the unix socket, which the temporary server the entrypoint
      # runs during initdb (db/init/00-roles.sh) also answers -- while
      # listen_addresses is still empty. The container then reported healthy
      # mid-init, bootstrap connected over TCP and got "Connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d course"]
      interval: 2s
      timeout: 3s
      retries: 30
    # idle_in_transaction_session_timeout stays at the image's own default (0,
    # disabled): a worker parked on a failpoint holds an idle-in-transaction
    # connection on purpose (SPEC "Failpoints" #16) and must not be dropped
    # before the checker reads its ack.

  api:
    build: {context: ., dockerfile: src/Course.Api/Dockerfile}
    environment:
      COURSE_JWT_ISSUER: moduledev-course
      COURSE_JWT_AUDIENCE: moduledev-api
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY:-dev-insecure-key-not-for-production-32}
      COURSE_RUNTIME_DSN: Host=postgres;Port=5432;Database=course;Username=course_runtime;Password=${COURSE_RUNTIME_PASSWORD:-runtime}
      # Ticket 07: the generic signature boundary's HMAC key. Named exactly
      # PROVIDER_HMAC_SECRET (SPEC/checker fixture), shared with receipt-adapter
      # once ticket 12 builds it -- both sides must sign/verify with the same
      # bytes. No tracked default of real value; the checker always replaces it.
      PROVIDER_HMAC_SECRET: ${PROVIDER_HMAC_SECRET:-dev-insecure-hmac-secret-not-for-production}
    # Not depends_on: cli -- week 2's open checker builds and starts only the
    # six services TASK.md actually requires (this one plus cli, gateway,
    # postgres, worker-a, worker-b), scoped by name, so a hard dependency on
    # another named service's *completion* is the only kind that would even
    # resolve. Readiness below doesn't wait on schema/publication either, so
    # api comes up against postgres alone; cli's own default command (bootstrap,
    # below) applies migrations and publishes built-ins in parallel.
    depends_on: {postgres: {condition: service_healthy}}

  gateway:
    build: {context: ., dockerfile: src/Course.Gateway/Dockerfile}
    ports: ["8080:8080"]          # единственная публикация порта во всём файле
    depends_on: {api: {condition: service_started}}

  # Compose's own `up` runs this with its default command (bootstrap: apply
  # migrations, publish built-in actions and maps, exit) -- the checker (and
  # `make` targets) invoke it ad hoc instead via `compose run --rm cli <args>`,
  # which overrides the command and ignores this default entirely.
  cli:
    build: {context: ., dockerfile: src/Course.Cli/Dockerfile}
    command: ["bootstrap"]
    environment: *course-db-env
    restart: "no"
    depends_on: {postgres: {condition: service_healthy}}

  # worker-a builds workflow-worker:local; worker-b below only references that
  # same tag with no build of its own -- Compose builds it once and both
  # services run the identical image, differing only in WORKFLOW_WORKER_OWNER
  # (SPEC "тот же image, lease owner worker-a/worker-b").
  worker-a:
    build: {context: ., dockerfile: src/Workflow.Worker/Dockerfile}
    image: workflow-worker:local
    environment:
      <<: *course-db-env
      WORKFLOW_WORKER_OWNER: worker-a
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}
    depends_on: {api: {condition: service_started}}

  worker-b:
    image: workflow-worker:local
    environment:
      <<: *course-db-env
      WORKFLOW_WORKER_OWNER: worker-b
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}
    depends_on: {api: {condition: service_started}}

  # Given external component, pinned by digest (SPEC "Provider image
  # закреплён по digest") -- tag alone is never trusted. No host port: the
  # only Compose-visible network is the internal one, gateway stays the sole
  # external entry point.
  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator@sha256:70e5e0dd9ab8425be84de431ec74516f9bedf5d5529077358e2e2b2037fe0c74
    environment:
      # No compose-level default here: PROVIDER_CALLBACK_CAPABILITY is one of
      # the three variables configuration.md's own table marks
      # "Default в tracked Compose: Нет" (unlike PROVIDER_URL/OUTBOX_OWNER,
      # which the table explicitly allows a default for) -- a working local
      # value lives in .env.example instead, loaded from `.env`, never
      # baked into this tracked file.
      CALLBACK_URL: http://receipt-adapter:8082/callbacks/provider-v02/${PROVIDER_CALLBACK_CAPABILITY}
      AUDIT_TOKEN: ${PROVIDER_AUDIT_TOKEN:-}
      # SIMULATOR_MODE/CALLBACK_DELAY/CALLBACK_TIMEOUT/CALLBACK_MAX_ATTEMPTS/
      # CALLBACK_RETRY_DELAY are deliberately absent, not set to an empty
      # `${VAR:-}` default: the image rejects an *empty* SIMULATOR_MODE
      # outright ("SIMULATOR_MODE is not supported"), unlike a genuinely
      # unset variable, which it defaults to "success" -- confirmed by
      # running the pinned image directly. The checker supplies its own
      # real values per scenario when it wants anything else.

  # One locally built image, three entrypoints (SPEC "Три Python-сервиса
  # запускаются разными entrypoints одного локально собранного image"). Only
  # this service declares `build:` -- receipt-adapter and inbox-reconciler
  # below just reference the same `perimeter:local` tag, same pattern as
  # worker-a/worker-b sharing `workflow-worker:local`. No host port; the
  # dispatcher never reads physical tables, only delivery.claim_outbox/
  # succeed_outbox/fail_outbox under its own least-privilege role (ticket 09).
  outbox-dispatcher:
    build: {context: ./python}
    image: perimeter:local
    command: ["outbox-dispatcher"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: course
      PGUSER: outbox_dispatcher
      PGPASSWORD: ${COURSE_OUTBOX_PASSWORD:-outbox}
      PGAPPNAME: outbox-dispatcher
      PROVIDER_URL: ${PROVIDER_URL:-http://provider-simulator:8081}
      OUTBOX_OWNER: ${OUTBOX_OWNER:-outbox-dispatcher}
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-}
    depends_on:
      postgres: {condition: service_healthy}
      provider-simulator: {condition: service_started}

  # Ticket 12: the anti-corruption layer. No PGHOST/PGUSER/... entry at all --
  # this process has no PostgreSQL credentials in any form (SPEC/acceptance:
  # "У процесса нет учётных данных к PostgreSQL ни в каком виде"), and no
  # host port either, matching every other Python service.
  #
  # PROVIDER_CALLBACK_CAPABILITY/PROVIDER_CALLBACK_TOKEN carry no compose-level
  # default on purpose -- configuration.md's table marks both
  # "Default в tracked Compose: Нет" (04-week-3.md: "Synthetic JWT/HMAC/
  # capability values передаются только через environment проверочного
  # запуска и не имеют default в tracked Compose"), unlike PROVIDER_HMAC_SECRET
  # just above (an existing ticket-07 default, not this ticket's to remove).
  # A missing value here means the adapter fails fast on start (ticket 12
  # acceptance), exactly as required; local dev values live only in
  # .env.example, loaded from an untracked `.env`, never in this file.
  receipt-adapter:
    image: perimeter:local
    command: ["receipt-adapter"]
    environment:
      PROVIDER_CALLBACK_CAPABILITY: ${PROVIDER_CALLBACK_CAPABILITY}
      PROVIDER_CALLBACK_TOKEN: ${PROVIDER_CALLBACK_TOKEN}
      PROVIDER_HMAC_SECRET: ${PROVIDER_HMAC_SECRET:-dev-insecure-hmac-secret-not-for-production}
      RECEIPT_API_URL: ${RECEIPT_API_URL:-http://gateway:8080/api/receipt/accept}
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-}
    depends_on:
      gateway: {condition: service_started}

  # Ticket 13: the thinnest of the three -- one call to delivery.reconcile_inbox
  # per cycle, its own least-privilege role, no direct table DML.
  inbox-reconciler:
    image: perimeter:local
    command: ["inbox-reconciler"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: course
      PGUSER: inbox_reconciler
      PGPASSWORD: ${COURSE_INBOX_PASSWORD:-inbox}
      PGAPPNAME: inbox-reconciler
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-}
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
